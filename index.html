<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victoria Jewelry</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./main.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="wrapper" id="Tienda">
        <header class="header-mobile">
            <h1 class="logo">Victoria Jewelry</h1>
            <button class="open-menu" id="open-menu">
                <i class="bi bi-list"></i>
            </button>
        </header>
        <aside>
            <button class="close-menu" id="close-menu">
                <i class="bi bi-x"></i>
            </button>
            <header>
                <h1 class="logo">Victoria Jewelry</h1>
            </header>
            <nav>
                <ul class="menu">
                    <li>
                        <button id="todos" class="boton-menu boton-categoria active"><i class="bi bi-hand-index-thumb-fill"></i> Todos los productos</button>
                    </li>
                    <li>
                        <button id="aretes" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Aretes </button>
                    </li>
                    <li>
                        <button id="collares" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Collares </button>
                    </li>
                    <li>
                        <button id="pulseras" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Pulseras </button>
                    </li>
                    <li>
                        <button id="reloj" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Reloj </button>
                    </li>
                    <li>
                        <button id="boton-carrito" class="boton-menu boton-carrito">
                            <i class="bi bi-cart-fill"></i> Carrito 
                            <span id="numerito" class="numerito">0</span>
                        </button>
                    </li>
                </ul>
            </nav>
            <footer>
                <p class="texto-footer">© Victoria Jewelry</p>
            </footer>
        </aside>
        <main>
            <h2 class="titulo-principal" id="titulo-principal">Todos los productos</h2>
            <div id="contenedor-productos" class="contenedor-productos">
                <!--se va a completar con js-->
            </div>
        </main>
    </div>
    <!--CARRITO-->
    <div id="Carrito" style="display: none;">
        <div class="wrapper">
            <aside>
                <header>
                    <h1 class="logo">Victoria Jewelry</h1>
                </header>
                <nav>
                    <ul>
                        <li>
                        <button id="boton-volver-tienda" class="boton-menu boton-volver">
                            <i class="bi bi-arrow-left-circle-fill"></i> Seguir comprando
                        </button>
                        </li>
                        <li>
                            <button class="boton-menu boton-carrito active">
                                <i class="bi bi-cart-fill"></i> Carrito
                            </button>
                        </li>
                    </ul>
                </nav>
                <footer>
                    <p class="texto-footer">© Victoria Jewelry</p>
                </footer>
            </aside>
            <main>
                <h2 class="titulo-principal" id="titulo-principal-carrito">Carrito</h2>
                <div class="contenedor-carrito">
                    <p id="carrito-vacio" class="carrito-vacio">Tu carrito está vacío. <i class="bi bi-emoji-tear-fill"></i> </p>

                    <div id="carrito-productos" class="carrito-productos disabled">
                        <!-- Los productos del carrito se cargarán aquí -->
                    </div>
                    
                    <div id="carrito-acciones" class="carrito-acciones disabled">
                        <div class="carrito-acciones-izquierda">
                            <button id="carrito-acciones-vaciar" class="carrito-acciones-vaciar"> Vaciar Carrito</button>
                        </div>
                        <div class="carrito-acciones-derecha">
                            <div class="carrito-acciones-total">
                                <p>Total</p>
                                <p id="total">$0.00</p>
                            </div>
                            <button id="carrito-acciones-comprar" class="carrito-acciones-comprar">Comprar ahora</button>
                        </div>
                    </div>

                    <p id="carrito-comprado" class="carrito-comprado disabled">Muchas gracias por tu compra. <i class="bi bi-emoji-smile-fill"></i></p>
                </div>
            </main>
        </div>
    </div>
    
    <!--MAIN JS-->
    <script>
        // PRODUCTOS
        const productos = [
            // Aretes
            {
                id: "aretes-01",
                titulo: "Arete 01",
                imagen: "./Imagen/aretes1.png",
                categoria: {
                    nombre: "Aretes",
                    id: "aretes"
                },
                precio: 1000
            },
            {

                imagen: "./Imagen/aretes2.png",
                categoria: {
                    nombre: "Aretes",
                    id: "aretes"
                },
                precio: 1000
            },
            {
                id: "aretes-03",
                titulo: "Arete 03",
                imagen: "./Imagen/aretes3.png",
                categoria: {
                    nombre: "Aretes",
                    id: "aretes"
                },
                precio: 1000
            },
            {
                id: "aretes-04",
                titulo: "Arete 04",
                imagen: "./Imagen/aretes4.png",
                categoria: {
                    nombre: "Aretes",
                    id: "aretes"
                },
                precio: 1000
            },
            {
                id: "aretes-05",
                titulo: "Arete 05",
                imagen: "./Imagen/aretes5.png",
                categoria: {
                    nombre: "Aretes",
                    id: "aretes"
                },
                precio: 1000
            },
            //collares
            {
                id: "collar-01",
                titulo: "Collar 01",
                imagen: "./Imagen/collar1.png",
                categoria: {
                    nombre: "Collar",
                    id: "collares"
                },
                precio: 1000
            },
            {
                id: "collar-02",
                titulo: "Collar 02",
                imagen: "./Imagen/collar2.png",
                categoria: {
                    nombre: "Collar",
                    id: "collares"
                },
                precio: 1000
            },
            {
                id: "collar-03",
                titulo: "Collar 03",
                imagen: "./Imagen/collar3.png",
                categoria: {
                    nombre: "Collar",
                    id: "collares"
                },
                precio: 1000
            },
            {
                id: "collar-04",
                titulo: "Collar 04",
                imagen: "./Imagen/collar4.png",
                categoria: {
                    nombre: "Collar",
                    id: "collares"
                },
                precio: 1000
            },
            {
                id: "collar-05",
                titulo: "Collar 05",
                imagen: "./Imagen/collar5.png",
                categoria: {
                    nombre: "Collar",
                    id: "collares"
                },
                precio: 1000
            },
            //pulseras
            {
                id: "pulsera-01",
                titulo: "Pulsera 01",
                imagen: "./Imagen/pulsera1.png",
                categoria: {
                    nombre: "Pulsera",
                    id: "pulseras"
                },
                precio: 1000
            },
            {
                id: "pulsera-02",
                titulo: "Pulsera 02",
                imagen: "./Imagen/pulsera2.png",
                categoria: {
                    nombre: "Pulsera",
                    id: "pulseras"
                },
                precio: 1000
            },
            {
                id: "pulsera-03",
                titulo: "Pulsera 03",
                imagen: "./Imagen/pulsera3.png",
                categoria: {
                    nombre: "Pulsera",
                    id: "pulseras"
                },
                precio: 1000
            },
            {
                id: "pulsera-04",
                titulo: "Pulsera 04",
                imagen: "./Imagen/pulsera4.png",
                categoria: {
                    nombre: "Pulsera",
                    id: "pulseras"
                },
                precio: 1000
            },
            {
                id: "pulsera-05",
                titulo: "Pulsera 05",
                imagen: "./Imagen/pulsera5.png",
                categoria: {
                    nombre: "Pulsera",
                    id: "pulseras"
                },
                precio: 1000
            },
            //reloj
            {
                id: "reloj-01",
                titulo: "Reloj 01",
                imagen: "./Imagen/reloj1.png",
                categoria: {
                    nombre: "Reloj",
                    id: "reloj"
                },
                precio: 1000
            },
            {
                id: "reloj-02",
                titulo: "Reloj 02",
                imagen: "./Imagen/reloj2.png",
                categoria: {
                    nombre: "Reloj",
                    id: "reloj"
                },
                precio: 1000
            },
            {
                id: "reloj-03",
                titulo: "Reloj 03",
                imagen: "./Imagen/reloj3.png",
                categoria: {
                    nombre: "Reloj",
                    id: "reloj"
                },
                precio: 1000
            },
            {
                id: "reloj-04",
                titulo: "Reloj 04",
                imagen: "./Imagen/reloj4.png",
                categoria: {
                    nombre: "Reloj",
                    id: "reloj"
                },
                precio: 1000
            },
            {
                id: "reloj-05",
                titulo: "Reloj 05",
                imagen: "./Imagen/reloj5.png",
                categoria: {
                    nombre: "Reloj",
                    id: "reloj"
                },
                precio: 1000
            }, 
        ];

        // Variables globales
        const contenedorProductos = document.querySelector("#contenedor-productos");
        const botonesCategorias = document.querySelectorAll(".boton-categoria");
        const tituloPrincipal = document.querySelector("#titulo-principal");
        const numerito = document.querySelector("#numerito");
        const tiendaDiv = document.getElementById("Tienda");
        const carritoDiv = document.getElementById("Carrito");
        const botonCarrito = document.getElementById("boton-carrito");
        const botonVolverTienda = document.getElementById("boton-volver-tienda");

        // Inicializar productos en carrito desde localStorage
        let productosEnCarrito = JSON.parse(localStorage.getItem("productos-en-carrito")) || [];

        // Cargar productos en la tienda
        function cargarProductos(productosElegidos) {
            contenedorProductos.innerHTML = "";

            productosElegidos.forEach(producto => {
                const div = document.createElement("div");
                div.classList.add("producto");
                div.innerHTML = `
                    <img class="producto-imagen" src="${producto.imagen}" alt="${producto.titulo}">
                    <div class="producto-detalles">
                        <h3 class="producto-titulo">${producto.titulo}</h3>
                        <p class="producto-precio">$${producto.precio}</p>
                        <button class="producto-agregar" id="${producto.id}"> Agregar </button>
                    </div>
                `;
                contenedorProductos.append(div);
            });
            
            actualizarBotonesAgregar();
        }

        // Actualizar botones de agregar al carrito
        function actualizarBotonesAgregar() {
            const botonesAgregar = document.querySelectorAll(".producto-agregar");
            botonesAgregar.forEach(boton => {
                boton.addEventListener("click", agregarAlCarrito);
            });
        }

        // Agregar producto al carrito
        function agregarAlCarrito(e) {
            const idBoton = e.currentTarget.id;
            const productoAgregado = productos.find(producto => producto.id === idBoton);

            if(productosEnCarrito.some(producto => producto.id === idBoton)) {
                const index = productosEnCarrito.findIndex(producto => producto.id === idBoton);
                productosEnCarrito[index].cantidad++;
            } else {
                productoAgregado.cantidad = 1;
                productosEnCarrito.push(productoAgregado);
            } 

            actualizarNumerito();
            localStorage.setItem("productos-en-carrito", JSON.stringify(productosEnCarrito));
            
            Toastify({
                text: "Producto agregado al carrito",
                duration: 3000,
                close: true,
                gravity: "top", 
                position: "right", 
                stopOnFocus: true, 
                style: {
                    background: "linear-gradient(to right, #00b09b, #96c93d)",
                    borderRadius: "2rem",
                    textTransform: "uppercase",
                    fontSize: ".75rem"
                },
                offset: {
                    x: '1.5rem', 
                    y: '1.5rem' 
                }
            }).showToast();
        }

        // Actualizar el contador del carrito
        function actualizarNumerito() {
            const nuevoNumerito = productosEnCarrito.reduce((acc, producto) => acc + producto.cantidad, 0);
            numerito.innerText = nuevoNumerito;
        }

        // Filtrar productos por categoría
        botonesCategorias.forEach(boton => {
            boton.addEventListener("click", (e) => {
                botonesCategorias.forEach(boton => boton.classList.remove("active"));
                e.currentTarget.classList.add("active");

                if(e.currentTarget.id !== "todos") {
                    const productoCategoria = productos.find(producto => producto.categoria.id === e.currentTarget.id);
                    tituloPrincipal.innerText = productoCategoria.categoria.nombre;

                    const productosBoton = productos.filter(producto => producto.categoria.id === e.currentTarget.id);
                    cargarProductos(productosBoton);
                } else {
                    tituloPrincipal.innerText = "Todos los productos";
                    cargarProductos(productos);
                }
            });
        });

        // Funciones para cambiar entre tienda y carrito
        function mostrarCarrito() {
            tiendaDiv.style.display = "none";
            carritoDiv.style.display = "block";
            cargarProductosCarrito();
        }

        function mostrarTienda() {
            carritoDiv.style.display = "none";
            tiendaDiv.style.display = "";
            // Actualizar productos en carrito por si hubo cambios
            productosEnCarrito = JSON.parse(localStorage.getItem("productos-en-carrito")) || [];
            actualizarNumerito();
        }

        // Event Listeners para cambiar vistas
        botonCarrito.addEventListener("click", mostrarCarrito);
        botonVolverTienda.addEventListener("click", mostrarTienda);

        // Cargar productos al iniciar
        cargarProductos(productos);
        actualizarNumerito();

        // Funciones del carrito
        const contenedorCarritoVacio = document.querySelector("#carrito-vacio");
        const contenedorCarritoProductos = document.querySelector("#carrito-productos");
        const contenedorCarritoAcciones = document.querySelector("#carrito-acciones");
        const contenedorCarritoComprado = document.querySelector("#carrito-comprado");
        const botonVaciar = document.querySelector("#carrito-acciones-vaciar");
        const contenedorTotal = document.querySelector("#total");
        const botonComprar = document.querySelector("#carrito-acciones-comprar");

        // Cargar productos en el carrito
        function cargarProductosCarrito() {
            if (productosEnCarrito && productosEnCarrito.length > 0) {
                contenedorCarritoVacio.classList.add("disabled");
                contenedorCarritoProductos.classList.remove("disabled");
                contenedorCarritoAcciones.classList.remove("disabled");
                contenedorCarritoComprado.classList.add("disabled");
            
                contenedorCarritoProductos.innerHTML = "";
            
                productosEnCarrito.forEach(producto => {
                    const div = document.createElement("div");
                    div.classList.add("carrito-producto");
                    div.innerHTML = `
                        <img class="carrito-producto-imagen" src="${producto.imagen}" alt="${producto.titulo}">
                        <div class="carrito-producto-titulo">
                            <small>Título</small>
                            <h3>${producto.titulo}</h3>
                        </div>
                        <div class="carrito-producto-cantidad">
                            <small>Cantidad</small>
                            <p>${producto.cantidad}</p>
                        </div>
                        <div class="carrito-producto-precio">
                            <small>Precio</small>
                            <p>$${producto.precio}</p>
                        </div>
                        <div class="carrito-producto-subtotal">
                            <small>Subtotal</small>
                            <p>$${producto.precio * producto.cantidad}</p>
                        </div>
                        <button class="carrito-producto-eliminar" id="${producto.id}"><i class="bi bi-trash-fill"></i></button>
                    `;
                    contenedorCarritoProductos.append(div);
                });
            
                actualizarBotonesEliminar();
                actualizarTotal();
            } else {
                contenedorCarritoVacio.classList.remove("disabled");
                contenedorCarritoProductos.classList.add("disabled");
                contenedorCarritoAcciones.classList.add("disabled");
                contenedorCarritoComprado.classList.add("disabled");
            }
        }

        // Actualizar botones de eliminar
        function actualizarBotonesEliminar() {
            const botonesEliminar = document.querySelectorAll(".carrito-producto-eliminar");
            botonesEliminar.forEach(boton => {
                boton.addEventListener("click", eliminarDelCarrito);
            });
        }

        // Eliminar producto del carrito
        function eliminarDelCarrito(e) {
            const idBoton = e.currentTarget.id;
            const index = productosEnCarrito.findIndex(producto => producto.id === idBoton);
            
            productosEnCarrito.splice(index, 1);
            localStorage.setItem("productos-en-carrito", JSON.stringify(productosEnCarrito));
            
            cargarProductosCarrito();
            actualizarNumerito();

            Toastify({
                text: "Producto eliminado",
                duration: 3000,
                close: true,
                gravity: "top", 
                position: "right", 
                stopOnFocus: true, 
                style: {
                    background: "linear-gradient(to right, #4b33a8, #785ce9)",
                    borderRadius: "2rem",
                    textTransform: "uppercase",
                    fontSize: ".75rem"
                },
                offset: {
                    x: '1.5rem', 
                    y: '1.5rem' 
                }
            }).showToast();
        }

        // Vaciar carrito
        botonVaciar.addEventListener("click", vaciarCarrito);
        function vaciarCarrito() {
            Swal.fire({
                title: '¿Estás seguro?',
                icon: 'question',
                html: `Se van a borrar ${productosEnCarrito.reduce((acc, producto) => acc + producto.cantidad, 0)} productos.`,
                showCancelButton: true,
                focusConfirm: false,
                confirmButtonText: 'Sí',
                cancelButtonText: 'No'
            }).then((result) => {
                if (result.isConfirmed) {
                    productosEnCarrito = [];
                    localStorage.setItem("productos-en-carrito", JSON.stringify(productosEnCarrito));
                    cargarProductosCarrito();
                    actualizarNumerito();
                }
            });
        }

        // Actualizar total
        function actualizarTotal() {
            const totalCalculado = productosEnCarrito.reduce((acc, producto) => acc + (producto.precio * producto.cantidad), 0);
            contenedorTotal.innerText = `$${totalCalculado}`;
        }

        // Comprar
        botonComprar.addEventListener("click", comprarCarrito);
        function comprarCarrito() {
            if (productosEnCarrito.length === 0) {
                Swal.fire({
                    title: 'Carrito vacío',
                    text: 'No hay productos en el carrito',
                    icon: 'warning',
                    confirmButtonText: 'Ok'
                });
                return;
            }
            
            Swal.fire({
                title: '¿Confirmar compra?',
                text: `Total: $${productosEnCarrito.reduce((acc, producto) => acc + (producto.precio * producto.cantidad), 0)}`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Sí, comprar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    productosEnCarrito = [];
                    localStorage.setItem("productos-en-carrito", JSON.stringify(productosEnCarrito));
                    
                    contenedorCarritoVacio.classList.add("disabled");
                    contenedorCarritoProductos.classList.add("disabled");
                    contenedorCarritoAcciones.classList.add("disabled");
                    contenedorCarritoComprado.classList.remove("disabled");
                    
                    actualizarNumerito();
                    
                    Swal.fire({
                        title: '¡Compra realizada!',
                        text: 'Gracias por tu compra',
                        icon: 'success',
                        confirmButtonText: 'Ok'
                    });
                }
            });
        }
    </script>

    <!--MENU JS-->
    <script>
        const openMenu = document.querySelector("#open-menu");
        const closeMenu = document.querySelector("#close-menu");
        const aside = document.querySelector("aside");

        if (openMenu && aside) {
            openMenu.addEventListener("click", () => {
                aside.classList.add("aside-visible");
            });
        }

        if (closeMenu && aside) {
            closeMenu.addEventListener("click", () => {
                aside.classList.remove("aside-visible");
            });
        }
    </script>
</body>
</html>
